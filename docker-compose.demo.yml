# Demo stack: everything a live deployment would touch, running locally for $0.
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
#   vendors  stand-in Okta org + CrowdStrike Falcon tenant (warden/sandbox/vendors.py)   :5056/state
#   moto     AWS API emulator: block_ip writes real NACL deny rules                        :5055
#   mailpit  SMTP server + inbox UI: notify sends real email                                :8025
#   seed     loads the demo scenarios once; actions run live against the stand-ins
#
# The analyzer is the offline mock unless WARDEN_LLM=anthropic is exported, so the demo costs
# nothing in API calls.
x-demo-env: &demo
  WARDEN_LLM: ${WARDEN_LLM:-mock}
  WARDEN_LIVE_ACTIONS: "1"
  WARDEN_CONNECTORS: lock_user=okta,isolate_host=crowdstrike,block_ip=aws_nacl,notify=smtp
  WARDEN_OKTA_ORG: http://vendors:5056
  WARDEN_OKTA_TOKEN: sandbox
  WARDEN_CS_BASE: http://vendors:5056
  WARDEN_CS_CLIENT_ID: sandbox
  WARDEN_CS_SECRET: sandbox
  WARDEN_AWS_ENDPOINT: http://moto:5055
  WARDEN_AWS_NACL_ID: default
  AWS_ACCESS_KEY_ID: testing
  AWS_SECRET_ACCESS_KEY: testing
  AWS_REGION: us-east-1
  WARDEN_SMTP_HOST: mailpit
  WARDEN_SMTP_PORT: "1025"
  WARDEN_SMTP_FROM: warden@demo.local
  WARDEN_SMTP_TO: soc@demo.local

services:
  warden:
    environment:
      <<: *demo
      WARDEN_DATABASE_URL: postgresql+psycopg://warden:${POSTGRES_PASSWORD:-warden-local}@db:5432/warden
      WARDEN_DATA_DIR: /data
      WARDEN_ALLOW_NOAUTH: ${WARDEN_ALLOW_NOAUTH:-1}
    depends_on: [vendors, moto, mailpit]
  scheduler:
    environment:
      <<: *demo
      WARDEN_DATABASE_URL: postgresql+psycopg://warden:${POSTGRES_PASSWORD:-warden-local}@db:5432/warden
      WARDEN_DATA_DIR: /data
  vendors:
    image: warden:local
    entrypoint: ["uvicorn", "warden.sandbox.vendors:app", "--host", "0.0.0.0", "--port", "5056"]
    ports: ["127.0.0.1:5056:5056"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5056/state')"]
      interval: 10s
  moto:
    image: motoserver/moto:5.1.4
    environment: { MOTO_PORT: "5055" }
    ports: ["127.0.0.1:5055:5055"]
  mailpit:
    image: axllent/mailpit:latest
    profiles: !reset []
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  seed:
    image: warden:local
    command: ["demo"]
    healthcheck: { disable: true }   # a one-shot seed job serves no port
    environment:
      <<: *demo
      WARDEN_DATABASE_URL: postgresql+psycopg://warden:${POSTGRES_PASSWORD:-warden-local}@db:5432/warden
      WARDEN_DATA_DIR: /data
    env_file: [.env]
    volumes: [wardendata:/data]
    depends_on: { db: { condition: service_healthy }, warden: { condition: service_started },
                  vendors: { condition: service_started }, moto: { condition: service_started } }
    restart: "no"
